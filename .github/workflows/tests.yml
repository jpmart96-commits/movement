# Runs the test suite on every push, as a second check behind the local
# pre-push hook (tools/git-hooks/pre-push). A red X on the commit means the
# published app may be broken.
name: tests
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run.js
